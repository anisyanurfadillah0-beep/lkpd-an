<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathLearn AI - Masuk ke Sistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

    <div id="customModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white max-w-sm w-full rounded-2xl p-6 shadow-2xl animate-fade border border-slate-100">
            <h3 id="modalTitle" class="text-lg font-extrabold text-slate-900 mb-2">Notifikasi</h3>
            <p id="modalMessage" class="text-sm text-slate-600 mb-6 leading-relaxed"></p>
            <div class="flex justify-end gap-3" id="modalActions">
                <!-- Buttons injected dynamically -->
            </div>
        </div>
    </div>

    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="./halaman_login_registrasi.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl flex items-center justify-center font-black text-xl shadow-md text-white">∑</div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-blue-400 to-indigo-200 bg-clip-text text-transparent">MathLearn AI</h1>
                    <p class="text-[10px] text-slate-400 -mt-1 font-medium">Teorema Pythagoras & Geometri</p>
                </div>
            </a>
            <div id="sessionNavInfo" class="hidden flex items-center space-x-4">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="currentUserLabel" class="text-xs font-semibold text-slate-200">Pengguna</span>
                    <span id="currentRoleBadge" class="text-[10px] bg-blue-600 text-white font-bold px-2 py-0.5 rounded-full uppercase">Siswa</span>
                </div>
                <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-300 font-bold bg-rose-950/40 hover:bg-rose-900/50 px-3 py-1.5 rounded-lg transition border border-rose-800/50">
                    Keluar
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 animate-fade">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Selamat Datang</h2>
                <p class="text-xs text-slate-500 mt-1">Sistem Evaluasi & Pembelajaran Berbasis AI</p>
            </div>

            <!-- Tabs Auth Switcher -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button id="tabAuthLogin" onclick="setAuthMode('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-slate-800 transition">Masuk</button>
                <button id="tabAuthRegister" onclick="setAuthMode('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition">Daftar sebagai Siswa</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="fieldNamaLengkap" class="hidden">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="inputNama" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition" placeholder="Budi Santoso">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
                    <input type="email" id="inputEmail" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition" placeholder="user@mathlearn.id">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Kata Sandi</label>
                    <input type="password" id="inputPassword" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition" placeholder="••••••••">
                </div>

                <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3 space-y-2 text-[11px] text-slate-600">
                    <div class="rounded-xl border border-blue-200 bg-blue-50 p-2">
                        <p class="font-black text-blue-800">Siswa</p>
                        <p class="text-blue-700">Daftar akun siswa secara mandiri.</p>
                    </div>
                    <div class="rounded-xl border border-amber-200 bg-amber-50 p-2">
                        <p class="font-black text-amber-800">Guru</p>
                        <p class="text-amber-700">Gunakan undangan guru dari administrator.</p>
                    </div>
                    <div class="rounded-xl border border-rose-200 bg-rose-50 p-2">
                        <p class="font-black text-rose-800">Admin</p>
                        <p class="text-rose-700">Tidak ada pendaftaran admin publik.</p>
                    </div>
                </div>

                <button type="submit" id="btnAuthSubmit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition text-sm mt-2">
                    Masuk ke Sistem
                </button>
            </form>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="js/aplikasi_logic_state_management.js"></script>
    <script>
        // Check session on index load
        window.onload = function() {
            safePageInit('login');
        };
    </script>
</body>
</html>
